<template>
    <div class="lookup-wrapper">
        <label class="slds-form-element__label lookup-label">{label}</label>

        <template if:true={hasSelection}>
            <div class="selected-box">
                <a
                    href={accountUrl}
                    target="_blank"
                    class="selected-link"
                    title={selectedName}>
                    <lightning-icon
                        icon-name="standard:account"
                        size="small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    <span class="selected-name">{selectedName}</span>
                </a>

                <lightning-button-icon
                    icon-name="utility:close"
                    alternative-text="Remover"
                    title="Remover"
                    variant="bare"
                    onclick={handleClear}>
                </lightning-button-icon>
            </div>
        </template>

        <template if:false={hasSelection}>
            <lightning-input
                type="search"
                variant="label-hidden"
                placeholder="Pesquisar gerador de demanda..."
                value={searchTerm}
                onchange={handleSearchChange}>
            </lightning-input>

            <template if:true={hasResults}>
                <div class="lookup-results">
                    <template for:each={results} for:item="account">
                        <div
                            key={account.Id}
                            class="lookup-item"
                            data-id={account.Id}
                            data-name={account.Name}
                            onclick={handleSelect}>
                            <lightning-icon
                                icon-name="standard:account"
                                size="x-small"
                                class="slds-m-right_x-small">
                            </lightning-icon>
                            <span>{account.Name}</span>
                        </div>
                    </template>
                </div>
            </template>
        </template>
    </div>
</template>
